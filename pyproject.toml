[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navkit"
version = "0.2.0"
description = "A small, tested 2D navigation stack for mobile robots: occupancy grids, A*, pure pursuit, simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
navkit = "navkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/navkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["navkit"]
omit = ["*/viz.py"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
